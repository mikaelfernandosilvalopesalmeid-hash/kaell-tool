name: HydraPad build

on:
  push:
    paths:
      - '.buildpayload/**'
      - '.github/workflows/hydrapad-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore HydraPad source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src
          cat .buildpayload/c.* | base64 -d > /tmp/hydrapad_build.tar.gz
          echo '6ec128403901b3a7f1f2e32698bcd7c113d5dc4d24cf43bd38d55596b9cc4bd0  /tmp/hydrapad_build.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hydrapad_build.tar.gz -C src
          cp .buildpayload/bin2uf2.py src/tools/bin2uf2.py
      - name: Apply Wi-Fi STA patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .buildpayload/wifi_patch.* | base64 -d > /tmp/hydrapad_wifi.patch.gz
          echo '007e9dd34708fe4aed8fbc7ae380132fa44fd8c8749267513226fc16c24db4b9  /tmp/hydrapad_wifi.patch.gz' | sha256sum -c -
          gzip -dc /tmp/hydrapad_wifi.patch.gz > /tmp/hydrapad_wifi.patch
          (cd src && patch -p1 < /tmp/hydrapad_wifi.patch)
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/firmware/src/hydrapad_web.c")
          s=p.read_text()
          s=s.replace("if(got_ssid || !form_decode(body+eq+1,end-eq-1,ssid,33))return false;got_ssid=true;",
                      "if(got_ssid || !form_decode(body+eq+1,end-eq-1,ssid,33)) return false;\n            got_ssid=true;")
          s=s.replace("if(got_password || !form_decode(body+eq+1,end-eq-1,password,64))return false;got_password=true;",
                      "if(got_password || !form_decode(body+eq+1,end-eq-1,password,64)) return false;\n            got_password=true;")
          s=s.replace("if(now-last_network_tick<250000)return;last_network_tick=now;",
                      "if(now-last_network_tick<250000) return;\n    last_network_tick=now;")
          p.write_text(s)
          PY
          grep -Fq 'pico_lwip_mdns' src/firmware/CMakeLists.txt
          grep -Fq '"/api/wifi"' src/firmware/src/hydrapad_web.c
          grep -Fq 'hydrapad.local' src/firmware/src/hydrapad_web.c
      - name: Export patched source
        run: tar -czf hydrapad-source.tar.gz -C src .
      - uses: actions/upload-artifact@v4
        with:
          name: hydrapad-source
          path: hydrapad-source.tar.gz
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [main, diagnostic]
    steps:
      - uses: actions/checkout@v4
      - name: Restore HydraPad source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src
          cat .buildpayload/c.* | base64 -d > /tmp/hydrapad_build.tar.gz
          echo '6ec128403901b3a7f1f2e32698bcd7c113d5dc4d24cf43bd38d55596b9cc4bd0  /tmp/hydrapad_build.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hydrapad_build.tar.gz -C src
          cp .buildpayload/bin2uf2.py src/tools/bin2uf2.py
          test -f src/firmware/src/usb_descriptors.c
          grep -Fq '0x09cc' src/firmware/src/usb_descriptors.c
          grep -Fq "'main':(4,False)" src/tools/build.py
      - name: Apply Wi-Fi STA patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .buildpayload/wifi_patch.* | base64 -d > /tmp/hydrapad_wifi.patch.gz
          echo '007e9dd34708fe4aed8fbc7ae380132fa44fd8c8749267513226fc16c24db4b9  /tmp/hydrapad_wifi.patch.gz' | sha256sum -c -
          gzip -dc /tmp/hydrapad_wifi.patch.gz > /tmp/hydrapad_wifi.patch
          (cd src && patch -p1 < /tmp/hydrapad_wifi.patch)
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/firmware/src/hydrapad_web.c")
          s=p.read_text()
          s=s.replace("if(got_ssid || !form_decode(body+eq+1,end-eq-1,ssid,33))return false;got_ssid=true;",
                      "if(got_ssid || !form_decode(body+eq+1,end-eq-1,ssid,33)) return false;\n            got_ssid=true;")
          s=s.replace("if(got_password || !form_decode(body+eq+1,end-eq-1,password,64))return false;got_password=true;",
                      "if(got_password || !form_decode(body+eq+1,end-eq-1,password,64)) return false;\n            got_password=true;")
          s=s.replace("if(now-last_network_tick<250000)return;last_network_tick=now;",
                      "if(now-last_network_tick<250000) return;\n    last_network_tick=now;")
          p.write_text(s)
          PY
          grep -Fq 'pico_lwip_mdns' src/firmware/CMakeLists.txt
          grep -Fq '"/api/wifi"' src/firmware/src/hydrapad_web.c
          grep -Fq 'hydrapad.local' src/firmware/src/hydrapad_web.c
      - name: Install Arm build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build firmware
        working-directory: src
        run: python3 tools/build.py --profile ${{ matrix.profile }} --fetch
      - name: List release outputs
        working-directory: src
        run: |
          ls -lh releases
          sha256sum releases/*.uf2
          cat releases/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: hydrapad-${{ matrix.profile }}
          path: src/releases/*
          if-no-files-found: error
